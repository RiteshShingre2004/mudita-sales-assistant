# Render Blueprint: one web service + one Postgres database.
# Secrets are marked sync: false, so Render asks for them in the dashboard
# and they are never stored in this repository.
services:
  - type: web
    name: lumen-sales-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REPLY_MODEL
        value: openai/gpt-oss-20b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_INBOX_ADDRESS
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false

databases:
  - name: lumen-db
    plan: free
