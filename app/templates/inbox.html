{% extends "base.html" %}
{% block content %}
<main class="desk" id="desk">
  <section class="pane list-pane" aria-label="Inquiries">
    <div class="pane-head list-head">
      <div class="list-title">
        <h1>Inquiries</h1>
        <select id="channel-filter" aria-label="Filter by channel">
          <option value="">All channels</option>
          <option value="email">Email</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="instagram">Instagram</option>
        </select>
      </div>
      <label class="search">
        <span class="sr-only">Search inquiries</span>
        <input type="search" id="search" placeholder="Search inquiries" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="filters" id="status-filters" role="group" aria-label="Filter by status"></div>
    </div>
    <ul class="conv-list" id="conv-list"></ul>
    <p class="kbd-hint" aria-hidden="true">Use <kbd>↑</kbd> <kbd>↓</kbd> to move between inquiries</p>
  </section>

  <section class="pane thread-pane" aria-label="Conversation">
    <div class="pane-head thread-head" id="thread-head">
      <button class="back" id="back" type="button">Back to inquiries</button>
      <div id="thread-title"></div>
      <div id="control"></div>
    </div>
    <div id="paused-banner" class="paused-banner" hidden>You are in control. The assistant will not reply, offer slots or book meetings in this conversation.</div>
    <div class="thread-scroll" id="thread-scroll">
      <ol class="thread" id="thread"></ol>
    </div>
    <form class="composer" id="composer" hidden>
      <label class="sr-only" for="reply-text">Reply as operator</label>
      <textarea id="reply-text" rows="2" placeholder="Write a reply as yourself"></textarea>
      <div class="composer-foot">
        <span class="composer-note" id="composer-note"></span>
        <button type="submit" class="primary" id="send-btn">Send reply</button>
      </div>
    </form>
  </section>

  <aside class="pane lead-pane" aria-label="Lead file" id="lead-pane"></aside>
</main>
{% endblock %}
{% block scripts %}<script src="/static/inbox.js"></script>{% endblock %}
